name: Documentation Quality Verification

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/lint-docs.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/lint-docs.py'

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Documentation Linter
        run: python scripts/lint-docs.py .

openapi: 3.0.3
info:
  title: M-Pesa Analyzer Platform API
  description: Combined API contract for the M-Pesa Analyzer CodeIgniter 4 WebApp and FastAPI ML microservice.
  version: 1.4.0
servers:
  - url: http://localhost/api/v1
    description: WebApp & Mobile API Gateway
  - url: http://localhost:8001
    description: ML Intelligence Microservice
paths:
  /health:
    get:
      summary: Health check probe
      description: Returns liveness and service readiness status.
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db_configured:
                    type: boolean
                    example: true
  /upload:
    post:
      summary: Upload encrypted SMS transaction payload
      description: Ingests an AES-128-CBC encrypted binary stream with prefixed 16-byte IV.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Ingestion success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  messages_imported:
                    type: integer
                    example: 45
  /process/for-user/{user_id}:
    post:
      summary: Trigger ML batch analysis for user
      description: Spawns an asynchronous batch extraction job for unprocessed user transactions.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                  status:
                    type: string
                    example: starting
  /api/v1/chat:
    post:
      summary: Conversational AI financial assistant
      description: Contextual financial advice query with injected user spending and loan metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - message
              properties:
                user_id:
                  type: string
                  example: "4"
                message:
                  type: string
                  example: "How much did I spend this month?"
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        example: "user"
                      content:
                        type: string
                        example: "Hello"
      responses:
        '200':
          description: Financial assistant response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                    example: "This month, you spent KES 14,200 across 23 transactions."
                  latency_ms:
                    type: integer
                    example: 340
                  tokens_used:
                    type: integer
                    example: 185
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
